# The shared build profile of the fleet's CI and of every lane/workstation that wants to share compile-cache keys with it.
#
# A cargo config fragment, NEVER environment variables: a compiler cache (sccache, kache) hashes every CARGO_* variable the compiler is started with, so the same
# setting given as CARGO_PROFILE_DEV_DEBUG in one place and as `[profile.dev] debug` in another produces different keys (measured 2026-11-06: env vs config = no
# hit, config vs config = hit). ccid applies this file to its cargo checks with `cargo --config <file>`; `ccid dev-profile` prints it for the include file of a
# CARGO_HOME (scripts, lanes, workstations).
#
# No debug information in CI builds: smaller objects, faster links, identical keys everywhere.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

# ONE opt-level for every non-member crate: registry dependencies, proc-macros and build-script dependencies. A manifest or a
# generated workspace that declares its own [profile.*.package] table splits the key space instead of overriding this table's
# value, so every builder (lane, agent, CI, locked gate) must stop declaring one. Measured 2026-11-08 on the 5-repo lane set at
# debug 0: cold build 2053 CPU-s (vs 1607 at opt-level 0), tests 173 CPU-s per run (vs 932), cheapest at every cache hit rate.
[profile.dev.package."*"]
opt-level = 1

# Cargo's color setting is CARGO_TERM_COLOR in the environment of CI jobs today, and that variable is hashed into every compile-cache key like any CARGO_*: as config it
# is invisible to the cache, so a lane or workstation with the same file hits CI's entries whatever its terminal is.
[term]
color = "never"

# The ONE link driver on every host (Julian 2026-11-09: "we want to use wild everywhere. That is a decision by me. wild with
# fallback mold."). It is the nix-packaged wild-cc (pkgs/wild-cc in infra): rustc's bundled-lld selection is rewritten to Wild per
# link, and a link Wild refuses runs again with mold. The value is the bare name in every copy of this file, so the cargo config is
# byte-identical on lanes, workstations and CI; kache leaves `-C linker` out of every key (rlib keys stay, linked units re-key on
# the linker that really ran). No rustflags entry: the driver, not a rustc argument, selects the linker.
[target.x86_64-unknown-linux-gnu]
linker = "wild-cc"
