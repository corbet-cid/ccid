schema = 1
project = "ccid"

[render]
tool_revision = "223adb5a008f4ed1ba36d1f52796ccd29077db6e"

[checks.test]
kind = "commands"
commands = [["bash", ".ci/build.sh", "test"]]

[checks.build]
kind = "commands"
commands = [["bash", ".ci/build.sh"]]

# A narrow Rust compile gate; the bootstrap remains responsible for publishing tools.
[checks.compile]
kind = "cargo"
actions = ["build"]
release = true

[checks.registry-publisher]
kind = "commands"
commands = [["python3", ".ci/registry_publish_test.py"]]

[checks.hosted-contract]
kind = "commands"
commands = [["python3", ".ci/test_hosted_budget.py", "--lint"]]

[checks.cache-acceptance]
kind = "commands"
commands = [["cargo", "test", "--release", "--locked", "--test", "cache_acceptance", "--", "--ignored", "--nocapture"]]

[jobs.cache-acceptance]
scheduler = "crow"
checks = ["cache-acceptance"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-job.sh"]

[jobs.verify]
scheduler = "crow"
checks = ["test"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-job.sh"]

[jobs.compile]
scheduler = "crow"
checks = ["compile"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-job.sh"]

[checks.native-compile-cache]
kind = "commands"
commands = [["cargo", "test", "--release", "--locked", "--test", "native_compile_cache", "--", "--ignored", "--nocapture"]]

[jobs.native-compile-cache]
scheduler = "crow"
checks = ["native-compile-cache"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-job.sh"]
