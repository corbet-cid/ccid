schema = 1
project = "ccid"

[render]
tool_revision = "3bd0c9a089abd341f65f7cabd44cf608e8400b03"
tool_sha256 = "c1467201662056492c89968ad2c38bcd6eef30e1359466a54bac978cacbca9b3"

# Formatting, Clippy with warnings denied and the full test suite, on the
# release profile the compile job and the shipped binary share.
[checks.test]
kind = "cargo"
release = true

# A narrow Rust compile gate: the binary every release publishes.
[checks.compile]
kind = "cargo"
actions = ["build"]
release = true

# The binary a release publishes, with its commit embedded: a commands check
# hands the job's CI_COMMIT_SHA to the build script, the cargo checks do not.
# Never cached: the result is the file left in the target directory.
[checks.build]
kind = "commands"
cache = false
commands = [["cargo", "build", "--release", "--locked"]]

[checks.registry-publisher]
kind = "commands"
commands = [["python3", ".ci/registry_publish_test.py"]]

[checks.remote-ci]
kind = "commands"
commands = [["python3", "-I", ".ci/remote_ci_test.py"]]

# The acceptance tiers live in the one integration-test binary (`tests/it`):
# `--test it` plus the module filter selects exactly the former test file.
[checks.cache-acceptance]
kind = "commands"
commands = [["cargo", "test", "--release", "--locked", "--test", "it", "--", "--ignored", "--nocapture", "cache_acceptance"]]

[jobs.cache-acceptance]
scheduler = "forgejo"
runs_on = "linux"
checks = ["cache-acceptance"]
workflow = "acceptance"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["test", "registry-publisher", "remote-ci"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[jobs.compile]
scheduler = "forgejo"
runs_on = "linux"
checks = ["compile"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

# The rendered check-shell's runtime contract (src/render/check-shell.nix): a
# C++ program and a Rust binary with a C++ dependency linked inside it have
# only existing RUNPATH entries and start under `env -i`.
[checks.check-shell-probe]
kind = "commands"
commands = [["bash", ".ci/check-shell-probe.sh"]]

[jobs.check-shell-probe]
scheduler = "forgejo"
runs_on = "linux"
checks = ["check-shell-probe"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[checks.native-compile-cache]
kind = "commands"
commands = [["cargo", "test", "--release", "--locked", "--test", "it", "--", "--ignored", "--nocapture", "native_compile_cache"]]

[jobs.build]
scheduler = "forgejo"
runs_on = "linux"
checks = ["build"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[jobs.native-compile-cache]
scheduler = "forgejo"
runs_on = "linux"
checks = ["native-compile-cache"]
workflow = "acceptance"
command = ["ccid:run-declared-checks"]
events = ["manual"]

# Native platform evidence that no owned worker can produce: the provider's own workflow on this
# repository's mirror, dispatched by the remote CI broker (adapters/remote_ci.py) and reported back
# as the commit status "remote / <job>". At most one run per job and day, newest main only, and only
# when one of the paths changed.
[jobs.windows]
scheduler = "remote"
provider = "gitlab"
platform = "windows-x64"
workflow = "ccid-remote"
checks = ["test"]
push_branches = ["main"]
paths = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", ".gitlab-ci.yml"]
timeout_minutes = 90

[jobs.macos]
scheduler = "remote"
provider = "github"
platform = "macos-arm64"
workflow = "ccid-remote"
checks = ["test"]
push_branches = ["main"]
paths = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", ".github/workflows/ccid-remote.yml"]
timeout_minutes = 60
