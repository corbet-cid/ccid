schema = 1
project = "ccid"

[checks.test]
kind = "commands"
commands = [["bash", ".ci/build.sh", "test"]]

[checks.build]
kind = "commands"
commands = [["bash", ".ci/build.sh"]]

# A narrow Rust compile gate; the bootstrap remains responsible for publishing tools.
[checks.compile]
kind = "cargo"
actions = ["build"]
release = true

[checks.registry-publisher]
kind = "commands"
commands = [["python3", ".ci/registry_publish_test.py"]]

[checks.hosted-contract]
kind = "commands"
commands = [["python3", ".ci/test_hosted_budget.py", "--lint"]]

[jobs.verify]
scheduler = "crow"
checks = ["test"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-job.sh"]

[jobs.compile]
scheduler = "crow"
checks = ["compile"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-job.sh"]
