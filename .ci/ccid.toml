schema = 1
project = "ccid"

[render]
tool_revision = "105ddc4cc22bd460ddb7e9e68207f265ca229a34"
tool_sha256 = "d3378c2ee0185079dbd3dd7d2d5de4a904851158f0f4e647154b7f4158f9856d"

# Formatting, Clippy with warnings denied and the full test suite, on the
# release profile the compile job and the shipped binary share.
[checks.test]
kind = "cargo"
release = true

# A narrow Rust compile gate: the binary every release publishes.
[checks.compile]
kind = "cargo"
actions = ["build"]
release = true

# The binary a release publishes, with its commit embedded: a commands check
# hands the job's CI_COMMIT_SHA to the build script, the cargo checks do not.
# Never cached: the result is the file left in the target directory.
[checks.build]
kind = "commands"
cache = false
commands = [["cargo", "build", "--release", "--locked"]]

[checks.registry-publisher]
kind = "commands"
commands = [["python3", ".ci/registry_publish_test.py"]]

[checks.remote-ci]
kind = "commands"
commands = [["python3", "-I", ".ci/remote_ci_test.py"]]

[checks.cache-acceptance]
kind = "commands"
commands = [["cargo", "test", "--release", "--locked", "--test", "cache_acceptance", "--", "--ignored", "--nocapture"]]

[jobs.cache-acceptance]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["cache-acceptance"]
workflow = "acceptance"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["test", "registry-publisher", "remote-ci"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[jobs.compile]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["compile"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[checks.native-compile-cache]
kind = "commands"
commands = [["cargo", "test", "--release", "--locked", "--test", "native_compile_cache", "--", "--ignored", "--nocapture"]]

[jobs.build]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["build"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[jobs.native-compile-cache]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["native-compile-cache"]
workflow = "acceptance"
command = ["ccid:run-declared-checks"]
events = ["manual"]
