[package]
name = "ccid"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE.md"
description = "Shared check commands invoked by Crow"
repository = "https://github.com/corbet-labs/ccid"

[features]
windows-experimental = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"

tempfile = "3"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }
