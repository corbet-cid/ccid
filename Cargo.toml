[package]
name = "ccid"
default-run = "ccid"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE.md"
description = "Shared check commands invoked by Crow"
repository = "https://github.com/corbet-libs/ccid"

[features]
windows-experimental = []

[dependencies]
cqlt = { git = "https://git.corbet.ch/corbet-foss/cqlt", rev = "e6275c5373954ca7f3b4fc680ffaccc149dc32f6" }
cmnp = { git = "https://git.corbet.ch/corbet-foss/cmnp.git", rev = "45f79bbdc67f57b85dc91ffe6ad7210f4be1e680" }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"

tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
