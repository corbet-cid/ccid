# Remote CI on the GitHub mirror: the ccid remote job "macos" (.ci/ccid.toml, docs/rendering.md).
# Started only by workflow_dispatch from the broker (adapters/remote_ci.py) through the GitHub
# write gate, for one exact commit; pushes start nothing. The broker reports the result on the forge.
name: ccid-remote
run-name: "ccid remote ${{ inputs.job }} ${{ inputs.request }}"
on:
  workflow_dispatch:
    inputs:
      job:
        description: ccid remote job
        required: true
        type: string
      sha:
        description: exact commit
        required: true
        type: string
      request:
        description: broker request id
        required: true
        type: string
permissions:
  contents: read
jobs:
  macos:
    if: inputs.job == 'macos'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version --verbose
      - run: cargo build --release --locked
      - run: cargo test --release --locked
