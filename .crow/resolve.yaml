# Resolve the latest compatible Cargo dependency graph on Crow and publish a
# reviewable lock snapshot. The source worktree is never updated in place.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  RESOLVE_SOURCE_ARCHIVE: {default: ""}
  RESOLVE_SOURCE_SHA256: {default: ""}
  RESOLVE_SOURCE_COMMIT: {default: ""}
  RESOLVE_REPOSITORY_URL: {default: ""}
  RESOLVE_CHECKS: {default: ""}
  RESOLVE_GENERATE_LOCKFILE: {default: "0"}
  CCID_OUTPUT_ROOT: {default: ""}
  CCID_RESOLVE_CARGO: {default: "1"}
  CI_JOBS: {default: ""}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_TIMEOUT: {default: "2700"}
  CI_CACHE_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  CI_REPOSITORY_URL: {default: ""}
  CI_TEST_THREADS: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
steps:
  - name: cargo-resolution
    image: bash
    commands:
      - |
        set -eu
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        export MODE=build
        export CI_REPOSITORY_URL="$${CI_REPOSITORY_URL:-https://github.com/corbet-libs/ccid}"
        exec python3 - <<'PY_RESOLVE'
        import hashlib, json, os, pathlib, re, runpy, shutil, signal, subprocess, sys, tarfile, tempfile

        def interrupted(_signal, _frame):
            raise KeyboardInterrupt
        signal.signal(signal.SIGTERM, interrupted)
        with tempfile.TemporaryDirectory(prefix='ccid-bootstrap-') as directory:
            root = pathlib.Path(directory)
            snapshot = root / 'source.tar'
            shutil.copyfile(os.environ['SOURCE_ARCHIVE'], snapshot)
            digest = os.environ['SOURCE_SHA256']
            if not re.fullmatch(r'[0-9a-f]{64}', digest) or hashlib.file_digest(snapshot.open('rb'), 'sha256').hexdigest() != digest:
                raise SystemExit('Source archive SHA-256 mismatch')
            with snapshot.open('rb') as stream:
                commit = subprocess.check_output(['git', 'get-tar-commit-id'], stdin=stream, text=True).strip()
            if commit != os.environ['CI_COMMIT_SHA']:
                raise SystemExit('Source archive commit mismatch')
            source = root / 'source'
            source.mkdir()
            with tarfile.open(snapshot, 'r:') as archive:
                archive.extractall(source, filter='data')
            for path in source.rglob('*'):
                if not path.is_symlink():
                    os.utime(path, None)
            os.chdir(source)
            sys.path.insert(0, str(source))
            target = subprocess.check_output(['rustc', '-vV'], text=True)
            target = next(line.split(': ', 1)[1] for line in target.splitlines() if line.startswith('host: '))
            output_root = pathlib.Path(os.environ.get('CCID_OUTPUT_ROOT') or pathlib.Path(os.environ['CARGO_HOME']) / 'ccid-artifacts')
            core_destination = output_root / commit / target
            binary = core_destination / 'ccid'
            receipt_path = core_destination / 'receipt.json'
            reuse = False
            if binary.is_file() and receipt_path.is_file():
                try:
                    receipt = json.loads(receipt_path.read_text())
                    digest = hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest()
                    reuse = (receipt == {'binary_sha256': digest, 'source_revision': commit, 'target': target}
                             and subprocess.check_output([str(binary), 'source-revision'], text=True).strip() == commit)
                except (OSError, ValueError, subprocess.CalledProcessError):
                    reuse = False
            if reuse:
                print('ccid-artifact-reuse', binary, receipt_path)
            else:
                runpy.run_path(str(source / '.ci/bootstrap.py'), run_name='__main__')
                if not binary.is_file() or not receipt_path.is_file():
                    raise SystemExit('Bootstrap did not publish the expected ccid binary and receipt')
            target_inputs = [
                os.environ.get('RESOLVE_SOURCE_ARCHIVE', ''),
                os.environ.get('RESOLVE_SOURCE_SHA256', ''),
                os.environ.get('RESOLVE_SOURCE_COMMIT', ''),
                os.environ.get('RESOLVE_REPOSITORY_URL', ''),
            ]
            if any(target_inputs) and not all(target_inputs):
                raise SystemExit('RESOLVE_SOURCE_ARCHIVE, RESOLVE_SOURCE_SHA256, RESOLVE_SOURCE_COMMIT, and RESOLVE_REPOSITORY_URL must be supplied together')
            if all(target_inputs):
                target_archive, target_sha256, target_commit, target_repository = target_inputs
            else:
                target_archive, target_sha256, target_commit, target_repository = (
                    os.environ['SOURCE_ARCHIVE'], os.environ['SOURCE_SHA256'], commit,
                    os.environ['CI_REPOSITORY_URL'])
            os.environ.update({
                'SOURCE_ARCHIVE': target_archive,
                'SOURCE_SHA256': target_sha256,
                'CI_COMMIT_SHA': target_commit,
                'CI_REPOSITORY_URL': target_repository,
            })
            output = output_root / target_commit / 'cargo-resolution'
            command = [str(binary), 'cargo-resolve', '--repo', str(source), '--output-dir', str(output)]
            generate = os.environ.get('RESOLVE_GENERATE_LOCKFILE', '0')
            if generate not in ('0', '1'):
                raise SystemExit('RESOLVE_GENERATE_LOCKFILE must be 0 or 1')
            if generate == '1':
                command.append('--generate-lockfile')
            for check in os.environ.get('RESOLVE_CHECKS', '').split(','):
                if check:
                    command.extend(['--check', check])
            subprocess.run(command, check=True)
            for artifact in sorted(output.iterdir()):
                if artifact.is_file():
                    print('cargo-resolution-artifact', artifact, artifact.stat().st_size, hashlib.file_digest(artifact.open('rb'), 'sha256').hexdigest())
                    if artifact.suffix == '.json':
                        print(artifact.read_text())
        PY_RESOLVE
