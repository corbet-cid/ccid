# Resolve the latest compatible Cargo dependency graph on Crow with the verified
# ccid binary and publish a reviewable lock snapshot. The source worktree is
# never updated in place.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_TOOL_ARCHIVE: {default: ""}
  CI_TOOL_SHA256: {default: ""}
  CI_TOOL_BINARY: {default: ""}
  CI_TOOL_BINARY_SHA256: {default: ""}
  RESOLVE_SOURCE_ARCHIVE: {default: ""}
  RESOLVE_SOURCE_SHA256: {default: ""}
  RESOLVE_SOURCE_COMMIT: {default: ""}
  RESOLVE_REPOSITORY_URL: {default: ""}
  RESOLVE_CHECKS: {default: ""}
  RESOLVE_GENERATE_LOCKFILE: {default: "0"}
  CCID_OUTPUT_ROOT: {default: ""}
  CCID_RESOLVE_CARGO: {default: "1"}
  CI_JOBS: {default: ""}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_TIMEOUT: {default: "2700"}
  CI_CACHE_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  CI_REPOSITORY_URL: {default: ""}
  CI_TEST_THREADS: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
steps:
  - name: cargo-resolution
    image: bash
    environment:
      CCID_REVISION: 'b6efb8e612fb3bcca806286bf3927dae8ea6167f'
    commands:
      - |
        set -eu
        test -n "$CI_TOOL_BINARY"
        test -n "$CI_TOOL_BINARY_SHA256"
        printf '%s  %s\n' "$CI_TOOL_SHA256" "$CI_TOOL_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$CI_TOOL_ARCHIVE")" = "$CCID_REVISION"
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        case "$RESOLVE_GENERATE_LOCKFILE" in 0|1) ;; *) echo 'RESOLVE_GENERATE_LOCKFILE must be 0 or 1' >&2; exit 2;; esac
        # Resolve another committed consumer when all four target inputs are
        # supplied together; none resolves this workflow's own source.
        if [ -n "$RESOLVE_SOURCE_ARCHIVE$RESOLVE_SOURCE_SHA256$RESOLVE_SOURCE_COMMIT$RESOLVE_REPOSITORY_URL" ]; then
          if [ -z "$RESOLVE_SOURCE_ARCHIVE" ] || [ -z "$RESOLVE_SOURCE_SHA256" ] || [ -z "$RESOLVE_SOURCE_COMMIT" ] || [ -z "$RESOLVE_REPOSITORY_URL" ]; then
            echo 'RESOLVE_SOURCE_ARCHIVE, RESOLVE_SOURCE_SHA256, RESOLVE_SOURCE_COMMIT, and RESOLVE_REPOSITORY_URL must be supplied together' >&2
            exit 2
          fi
          target_archive=$RESOLVE_SOURCE_ARCHIVE
          target_sha256=$RESOLVE_SOURCE_SHA256
          target_commit=$RESOLVE_SOURCE_COMMIT
          target_repository=$RESOLVE_REPOSITORY_URL
        else
          test -n "$CI_REPOSITORY_URL"
          target_archive=$SOURCE_ARCHIVE
          target_sha256=$SOURCE_SHA256
          target_commit=$CI_COMMIT_SHA
          target_repository=$CI_REPOSITORY_URL
        fi
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        output_root="$${CCID_OUTPUT_ROOT:-$CARGO_HOME/ccid-artifacts}"
        output="$output_root/$target_commit/cargo-resolution"
        # The working directory only has to sit outside the output directory:
        # the tool verifies and unpacks the target archive itself.
        workdir=$(mktemp -d)
        trap 'rm -rf -- "$workdir"' EXIT
        cd "$workdir"
        set -- "$CI_TOOL_BINARY" cargo-resolve --repo "$workdir" --output-dir "$output"
        if [ "$RESOLVE_GENERATE_LOCKFILE" = 1 ]; then
          set -- "$@" --generate-lockfile
        fi
        for check in $(printf '%s' "$RESOLVE_CHECKS" | tr ',' ' '); do
          set -- "$@" --check "$check"
        done
        env SOURCE_ARCHIVE="$target_archive" SOURCE_SHA256="$target_sha256" \
          CI_COMMIT_SHA="$target_commit" CI_REPOSITORY_URL="$target_repository" "$@"
        for artifact in "$output"/*; do
          [ -f "$artifact" ] || continue
          printf 'cargo-resolution-artifact %s %s %s\n' "$artifact" "$(wc -c < "$artifact" | tr -d ' ')" "$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          case "$artifact" in *.json) cat "$artifact";; esac
        done
