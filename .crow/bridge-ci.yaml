# Trusted, manually selected orchestration only. Contribution workflows are never loaded.
when:
  - event: manual
labels:
  backend: local
skip_clone: true
steps:
  - name: approved-isolated-check
    image: bash
    commands:
      - |
        set -eu
        # These are operator-owned runner environment values, not request overrides.
        printf '%s  %s\n' "$CCID_BRIDGE_BINARY_SHA256" "$CCID_BRIDGE_BINARY" | sha256sum --check --strict
        test "$("$CCID_BRIDGE_BINARY" source-revision)" = "$CCID_BRIDGE_REVISION"
        "$CCID_BRIDGE_BINARY" --enable-gitlab-import --config "$CCID_BRIDGE_CONFIG" \
          --state-dir "$CCID_BRIDGE_STATE_DIR" --mr "$CCID_BRIDGE_MR" \
          --ci-plan "$CCID_BRIDGE_APPROVAL_REQUEST" --dispatch-ci \
          --kubernetes-command "$CCID_BRIDGE_KUBERNETES_COMMAND"
