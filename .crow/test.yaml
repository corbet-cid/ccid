# Self-test the exact staged ccid source on Crow using existing tools only.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_JOBS: {default: ""}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_TIMEOUT: {default: "1800"}
  CI_CACHE_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  CI_REPOSITORY_URL: {default: ""}
  CI_TEST_THREADS: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  PUBLISHER_ONLY: {default: ""}
steps:
  - name: checked-native-tool
    image: bash
    commands:
      - |
        set -eu
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        export MODE=test
        exec python3 - <<'PY_BOOTSTRAP'
        import hashlib, os, pathlib, re, runpy, shutil, signal, subprocess, sys, tarfile, tempfile

        def interrupted(_signal, _frame):
            raise KeyboardInterrupt
        signal.signal(signal.SIGTERM, interrupted)
        with tempfile.TemporaryDirectory(prefix='ccid-bootstrap-') as directory:
            root = pathlib.Path(directory)
            snapshot = root / 'source.tar'
            shutil.copyfile(os.environ['SOURCE_ARCHIVE'], snapshot)
            digest = os.environ['SOURCE_SHA256']
            if not re.fullmatch(r'[0-9a-f]{64}', digest) or hashlib.file_digest(snapshot.open('rb'), 'sha256').hexdigest() != digest:
                raise SystemExit('Source archive SHA-256 mismatch')
            with snapshot.open('rb') as stream:
                commit = subprocess.check_output(['git', 'get-tar-commit-id'], stdin=stream, text=True).strip()
            if commit != os.environ['CI_COMMIT_SHA']:
                raise SystemExit('Source archive commit mismatch')
            source = root / 'source'
            source.mkdir()
            with tarfile.open(snapshot, 'r:') as archive:
                archive.extractall(source, filter='data')
            # Bootstrap source is verified. Refresh it conservatively; Rust consumer
            # checks use the tested content-aware freshness path after this tool exists.
            for path in source.rglob('*'):
                if not path.is_symlink():
                    os.utime(path, None)
            os.chdir(source)
            sys.path.insert(0, str(source))
            if os.environ.get('PUBLISHER_ONLY') == '1':
                subprocess.run([sys.executable, '.ci/release_publish_test.py'], check=True)
                raise SystemExit(0)
            runpy.run_path(str(source / '.ci/bootstrap.py'), run_name='__main__')
        PY_BOOTSTRAP
