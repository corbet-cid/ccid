# Run explicit checks on a separately identified source archive with the verified
# ccid binary. Crow's commit identifies this workflow; the child identifies the
# consumer archive. This route does not resolve or update dependencies.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_TOOL_ARCHIVE: {default: ""}
  CI_TOOL_SHA256: {default: ""}
  CHECK_SOURCE_ARCHIVE: {default: ""}
  CHECK_SOURCE_SHA256: {default: ""}
  CHECK_SOURCE_COMMIT: {default: ""}
  CHECK_REPOSITORY_URL: {default: ""}
  CHECKS: {default: ""}
  CI_JOBS: {default: ""}
  CI_TEST_THREADS: {default: ""}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_TIMEOUT: {default: ""}
  CI_CACHE_ROOT: {default: ""}
  CI_NIX_JOBS: {default: ""}
  CI_LINKER: {default: system}
  TMPDIR: {default: ""}
  CI_TOOL_BINARY: {default: ""}
  CI_TOOL_BINARY_SHA256: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_REPOSITORY_URL: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
steps:
  - name: selected-archive-checks
    image: bash
    environment:
      CCID_REVISION: '85e316579ea938c42a4e45d42cb3ac94aa2d9328'
    commands:
      - |
        set -eu
        test -n "$CHECK_SOURCE_ARCHIVE"
        test -n "$CHECK_SOURCE_SHA256"
        test -n "$CHECK_SOURCE_COMMIT"
        test -n "$CHECK_REPOSITORY_URL"
        test -n "$CHECKS"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        printf '%s  %s\n' "$CI_TOOL_SHA256" "$CI_TOOL_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$CI_TOOL_ARCHIVE")" = "$CCID_REVISION"
        test -n "$CI_TOOL_BINARY"
        test -n "$CI_TOOL_BINARY_SHA256"
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        printf 'archive-check harness_repository=%s harness_commit=%s harness_sha256=%s tool_revision=%s tool_archive_sha256=%s tool_binary_sha256=%s\n' \
          "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA" "$SOURCE_SHA256" "$CCID_REVISION" "$CI_TOOL_SHA256" "$CI_TOOL_BINARY_SHA256"
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        exec env SOURCE_ARCHIVE="$CHECK_SOURCE_ARCHIVE" SOURCE_SHA256="$CHECK_SOURCE_SHA256" \
          CI_COMMIT_SHA="$CHECK_SOURCE_COMMIT" CI_REPOSITORY_URL="$CHECK_REPOSITORY_URL" \
          "$CI_TOOL_BINARY" check --archive "$CHECK_SOURCE_ARCHIVE" \
          --sha256 "$CHECK_SOURCE_SHA256" --commit "$CHECK_SOURCE_COMMIT" --check "$CHECKS"
