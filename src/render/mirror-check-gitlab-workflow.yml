# Pipelines exist for merge requests (the check), for release tags and for the release mirror's own
# runs, and for nothing else: a pushed branch creates none.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RELEASE_TAG =~ /^v/'
