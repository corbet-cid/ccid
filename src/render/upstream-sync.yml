# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Upstream sync: merges one upstream commit whose own ci run is green into the branch this run is dispatched on, checks the
# merge with the downstream's declared check job and pushes it only when the merge is clean and the checks are green. It also
# gives the downstream the upstream's release tags and a release that points at the upstream's assets. Dispatch only.
name: upstream-sync
on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: "The upstream commit (40 hex characters) whose ci run is green"
        required: true
concurrency:
  group: ccid-upstream-sync
  cancel-in-progress: false
jobs:
  upstream-sync:
    runs-on: CCID_CLASS
    steps:
      - name: Merge the upstream commit
        env:
          SYNC_SERVER: ${{ github.server_url }}
          SYNC_REPOSITORY: ${{ github.repository }}
          SYNC_TOKEN: ${{ github.token }}
          SYNC_UPSTREAM_COMMIT: ${{ github.event.inputs.upstream_commit }}
          SYNC_BRANCH: ${{ github.ref_name }}
          SYNC_UPSTREAM_URL: 'CCID_SYNC_URL'
          SYNC_UPSTREAM_BRANCH: 'CCID_SYNC_UPSTREAM_BRANCH'
        run: |
          CCID_SYNC_MERGE
CCID_SYNC_CHECK
      - name: Push the merge, the tags and the releases
        env:
          SYNC_SERVER: ${{ github.server_url }}
          SYNC_REPOSITORY: ${{ github.repository }}
          SYNC_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ github.ref_name }}
          SYNC_UPSTREAM_URL: 'CCID_SYNC_URL'
        run: |
          CCID_SYNC_PUBLISH
