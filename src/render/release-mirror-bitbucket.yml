# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Release mirror (pull model): when a release tag reaches this repository, copy the assets of the
# Forgejo release of the same tag to the repository's Downloads as `<tag>-<asset name>` (Bitbucket
# has no releases). Needs the secured variable BITBUCKET_DOWNLOADS_TOKEN (a repository access token).
# The forge builds and publishes; this step only reads, verifies and republishes. Tags only.
image: atlassian/default-image:4
pipelines:
  tags:
    'v*':
      - step:
          name: release-mirror
          max-time: 30
          script:
            - |
              MIRROR_TAG="$BITBUCKET_TAG"
              CCID_MIRROR_CORE
              work=$(mktemp -d)
              rc=0
              mirror_fetch "$MIRROR_TAG" "$work" || rc=$?
              if [ "$rc" = 3 ]; then exit 0; fi
              if [ "$rc" != 0 ]; then exit "$rc"; fi
              [ -n "${BITBUCKET_DOWNLOADS_TOKEN:-}" ] || { mirror_log "BITBUCKET_DOWNLOADS_TOKEN is not set"; exit 1; }
              api="https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/downloads"
              bb() { curl --silent --show-error --retry 3 -H "Authorization: Bearer $BITBUCKET_DOWNLOADS_TOKEN" "$@"; }
              bb --fail-with-body "$api?pagelen=100" > "$work/downloads.json"
              while IFS= read -r name; do
                target="$MIRROR_TAG-$name"
                size=$(wc -c < "$work/files/$name" | tr -d ' ')
                have=$(jq -r --arg n "$target" '[.values[]? | select(.name == $n) | .size][0] // empty' "$work/downloads.json")
                if [ "$have" = "$size" ]; then mirror_log "$target is already here"; continue; fi
                if [ -n "$have" ]; then mirror_log "$target exists here with another size; downloads are never replaced"; exit 1; fi
                cp "$work/files/$name" "$work/$target"
                bb --fail-with-body -X POST -F "files=@$work/$target" "$api" > /dev/null
                rm "$work/$target"
                mirror_log "uploaded $target"
              done < "$work/assets.txt"
              rm -r "$work"
