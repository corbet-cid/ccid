# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Publishes this repository's JSR package when the release tag arrives here. It only publishes: nothing is built
# or tested, nothing of ours is pushed to a registry from here and no token exists; JSR trusts this repository's
# GitHub workflows through OIDC. Other registries are published elsewhere (one publisher per registry).
name: jsr-publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: jsr-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Publish to JSR
        shell: bash
        run: |
          set -euo pipefail
          config=
          for candidate in jsr.json deno.json; do
            if [ -f "$candidate" ]; then config=$candidate; break; fi
          done
          [ -n "$config" ] || { echo "jsr-publish: no jsr.json or deno.json at the repository root" >&2; exit 1; }
          version=$(jq -er .version "$config")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "jsr-publish: $config says $version but the tag is $GITHUB_REF_NAME" >&2; exit 1; }
          deno publish
