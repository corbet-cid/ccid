# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Release mirror (pull model): when a release tag reaches this project, copy the Forgejo release of the
# same tag here (generic package files plus a GitLab release). The forge builds and publishes; this job
# only reads, verifies and republishes. Tags only: a branch pipeline is never created.
release-mirror:
  image: alpine:3.22
  interruptible: false
  timeout: 30 minutes
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RELEASE_TAG =~ /^v/'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      MIRROR_TAG="${CI_COMMIT_TAG:-${RELEASE_TAG:-}}"
      CCID_MIRROR_CORE
      case "$MIRROR_TAG" in
        v*[!A-Za-z0-9._+-]* | v) mirror_log "not a release tag: $MIRROR_TAG"; exit 1 ;;
        v*) ;;
        *) mirror_log "not a release tag: $MIRROR_TAG"; exit 1 ;;
      esac
      work=$(mktemp -d)
      rc=0
      mirror_fetch "$MIRROR_TAG" "$work" || rc=$?
      if [ "$rc" = 3 ]; then exit 0; fi
      if [ "$rc" != 0 ]; then exit "$rc"; fi
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      base="$api/packages/generic/$CI_PROJECT_NAME/$MIRROR_TAG"
      gl() { curl --silent --show-error --retry 3 -H "JOB-TOKEN: $CI_JOB_TOKEN" "$@"; }
      # sha256 of a package file already stored here, empty when there is none.
      stored() {
        code=$(gl -o "$work/stored.bin" -w '%{http_code}' "$base/$1" || true)
        if [ "$code" = 200 ]; then sha256sum "$work/stored.bin" | awk '{ print $1 }'; fi
      }
      if ! gl --fail "$api/repository/tags/$MIRROR_TAG" > /dev/null 2>&1; then
        mirror_log "the tag $MIRROR_TAG is not in this project (yet)"
        exit 1
      fi
      while IFS= read -r name; do
        want=$(sha256sum "$work/files/$name" | awk '{ print $1 }')
        have=$(stored "$name")
        if [ "$have" = "$want" ]; then mirror_log "$name is already here"; continue; fi
        if [ -n "$have" ]; then mirror_log "$name exists here with other content; assets are never replaced"; exit 1; fi
        gl --fail-with-body --upload-file "$work/files/$name" "$base/$name" > /dev/null
        [ "$(stored "$name")" = "$want" ] || { mirror_log "$name: the stored file differs from the upload"; exit 1; }
        mirror_log "uploaded $name"
      done < "$work/assets.txt"
      desc="$(cat "$work/notes.md")"
      if [ "$MIRROR_PRERELEASE" = true ]; then desc=$(printf 'Pre-release.\n\n%s' "$desc"); fi
      code=$(gl -o "$work/release.json" -w '%{http_code}' "$api/releases/$MIRROR_TAG" || true)
      if [ "$code" = 404 ]; then
        links='[]'
        while IFS= read -r name; do
          links=$(printf '%s' "$links" | jq -c --arg n "$name" --arg u "$base/$name" '. + [{name: $n, url: $u, link_type: "package"}]')
        done < "$work/assets.txt"
        jq -n --arg tag "$MIRROR_TAG" --arg name "$MIRROR_NAME" --arg desc "$desc" --argjson links "$links" \
          '{tag_name: $tag, name: $name, description: $desc, assets: {links: $links}}' > "$work/create.json"
        gl --fail-with-body -X POST "$api/releases" -H 'Content-Type: application/json' --data @"$work/create.json" > /dev/null
        mirror_log "created the release $MIRROR_TAG"
      elif [ "$code" = 200 ]; then
        gl --fail-with-body "$api/releases/$MIRROR_TAG/assets/links" > "$work/links.json"
        while IFS= read -r name; do
          if [ "$(jq -r --arg n "$name" '[.[] | select(.name == $n)] | length' "$work/links.json")" = 0 ]; then
            jq -n --arg n "$name" --arg u "$base/$name" '{name: $n, url: $u, link_type: "package"}' > "$work/link.json"
            gl --fail-with-body -X POST "$api/releases/$MIRROR_TAG/assets/links" -H 'Content-Type: application/json' --data @"$work/link.json" > /dev/null
            mirror_log "linked $name"
          fi
        done < "$work/assets.txt"
      else
        mirror_log "the release lookup answered HTTP $code"
        exit 1
      fi
      rm -r "$work"
