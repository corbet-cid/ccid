# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Pull-request check: when a pull request is opened or updated against this repository, run the verdict
# jobs of its manifest on GitHub's own compute. It only reads: a read-only token, no secret and no cache
# of ours. A push starts nothing; only a pull request does.
name: pr-check
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # shellcheck disable=SC2016
          helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "credential.helper=$helper" fetch --quiet --depth 1 origin "$GITHUB_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --quiet --force --detach FETCH_HEAD
          if git show FETCH_HEAD:.gitattributes 2> /dev/null | grep -q 'filter=lfs'; then
            git lfs install --local --skip-smudge
            git -c "credential.helper=$helper" lfs pull origin
          fi
      CCID_CHECK_SUMMARY
      - name: Run the verdict jobs
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work nixos/nix:latest sh -s <<'CCID_MIRROR_CHECK'
          CCID_CHECK_CORE
          CCID_MIRROR_CHECK
