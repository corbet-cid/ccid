# Merge-request check: run the verdict jobs of the repository's manifest on this platform's own compute.
# It only reads: no variable and no cache of ours. A merge request from a fork runs in the fork's project.
mr-check:
  image: nixos/nix:latest
  interruptible: true
  timeout: 60 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      CCID_CHECK_CORE
