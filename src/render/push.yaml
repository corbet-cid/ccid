# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Push execution for one opted-in job: no worker clone here (skip_clone).
# The Rust command stages the consumer at its newest head into shared
# worker state, refreshes the manifest refresh scope once, and runs the
# repository-owned job fresh under shared coalescing. Tool identity comes
# from the verified prebuilt binary below, delivered by repo-scoped Crow
# secrets (values are public immutable paths/digests, never credentials).
when:
  - event: push
    branch: CCID_PUSH_BRANCH
labels:
  backend: local
skip_clone: true
variables:
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_MEMORY_MB: {default: "8192"}
  CI_MEMORY_PER_JOB_MB: {default: "2048"}
steps:
  - name: push-job
    image: bash
    environment:
      CCID_REVISION: 'CCID_TOOL_REVISION'
      CI_TOOL_BINARY: {from_secret: CCID_SECRET_BINARY}
      CI_TOOL_BINARY_SHA256: {from_secret: CCID_SECRET_SHA}
    commands:
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        "$CI_TOOL_BINARY" push-run --consumer-url "CCID_CONSUMER_URL" --consumer-branch "CCID_PUSH_BRANCH" --job "CCID_PUSH_JOB" --trigger-kind self --trigger-sha "$CI_COMMIT_SHA" --trigger-branch "$CI_COMMIT_BRANCH" --trigger-repo "CCID_CONSUMER_URL"
