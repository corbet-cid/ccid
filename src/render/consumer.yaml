# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Dependency push fan-out: this repository's push event runs the consumer's
# repository-owned job under the same shared coalescing (no worker clone
# here either; the Rust command stages the consumer). The consumer's
# resolved lock must contain the event commit afterwards, or the run fails.
when:
  - event: push
    branch: CCID_DEP_BRANCH
labels:
  backend: local
skip_clone: true
variables:
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_MEMORY_MB: {default: "8192"}
  CI_MEMORY_PER_JOB_MB: {default: "2048"}
steps:
  - name: push-consumer
    image: bash
    environment:
      CCID_REVISION: 'CCID_TOOL_REVISION'
      CI_TOOL_BINARY: {from_secret: CCID_SECRET_BINARY}
      CI_TOOL_BINARY_SHA256: {from_secret: CCID_SECRET_SHA}
    commands:
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        "$CI_TOOL_BINARY" push-run --consumer-url "CCID_CONSUMER_URL" --consumer-branch "CCID_CONSUMER_BRANCH" --job "CCID_CONSUMER_JOB" --trigger-kind dep --trigger-sha "$CI_COMMIT_SHA" --trigger-name "CCID_DEP_NAME" --trigger-branch "$CI_COMMIT_BRANCH" --trigger-repo "CCID_DEP_REPO"
