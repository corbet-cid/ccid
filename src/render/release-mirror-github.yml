# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Release mirror (pull model): when a release tag reaches this repository, copy the Forgejo release
# of the same tag here. The forge builds and publishes; this workflow only reads, verifies and republishes.
name: release-mirror
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag of this repository to mirror again
        required: true
permissions:
  contents: write
concurrency:
  group: release-mirror-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mirror the Forgejo release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_RELEASE_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
          MIRROR_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CCID_MIRROR_CORE
          case "$MIRROR_TAG" in
            v*[!A-Za-z0-9._+-]* | v) mirror_log "not a release tag: $MIRROR_TAG"; exit 1 ;;
            v*) ;;
            *) mirror_log "not a release tag: $MIRROR_TAG"; exit 1 ;;
          esac
          work=$(mktemp -d)
          rc=0
          mirror_fetch "$MIRROR_TAG" "$work" || rc=$?
          if [ "$rc" = 3 ]; then exit 0; fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          repo="$GITHUB_REPOSITORY"
          api="${GITHUB_API_URL:-https://api.github.com}/repos/$repo"
          gh_api() {
            curl --silent --show-error --fail-with-body --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
          }
          id=
          page=1
          while [ -z "$id" ] && [ "$page" -le 10 ]; do
            gh_api "$api/releases?per_page=100&page=$page" > "$work/releases.json"
            [ "$(jq 'length' "$work/releases.json")" != 0 ] || break
            id=$(jq -r --arg t "$MIRROR_TAG" '[.[] | select(.tag_name == $t) | .id][0] // empty' "$work/releases.json")
            page=$((page + 1))
          done
          if [ -z "$id" ]; then
            jq -n --arg tag "$MIRROR_TAG" --arg name "$MIRROR_NAME" --rawfile body "$work/notes.md" --argjson pre "$MIRROR_PRERELEASE" \
              '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: $pre}' > "$work/create.json"
            id=$(gh_api -X POST "$api/releases" -H 'Content-Type: application/json' --data @"$work/create.json" | jq -r '.id')
            mirror_log "created the draft release $MIRROR_TAG"
          fi
          while IFS= read -r name; do
            want=$(sha256sum "$work/files/$name" | awk '{ print $1 }')
            size=$(wc -c < "$work/files/$name" | tr -d ' ')
            gh_api "$api/releases/$id/assets?per_page=100" > "$work/assets.json"
            state=$(jq -r --arg n "$name" '[.[] | select(.name == $n)][0] | if . == null then "absent" else (.state + " " + (.size | tostring) + " " + (.digest // "") + " " + (.id | tostring)) end' "$work/assets.json")
            case "$state" in
              absent) ;;
              "uploaded $size sha256:$want "* | "uploaded $size  "*) mirror_log "$name is already here"; continue ;;
              uploaded*) mirror_log "$name exists here with other content; assets are never replaced"; exit 1 ;;
              *) stub=${state##* }
                 mirror_log "removing the incomplete upload of $name"
                 gh_api -X DELETE "$api/releases/assets/$stub" > /dev/null ;;
            esac
            gh_api -X POST "${GITHUB_UPLOAD_URL:-https://uploads.github.com}/repos/$repo/releases/$id/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' --data-binary @"$work/files/$name" > "$work/uploaded.json"
            got_size=$(jq -r '.size | tostring' "$work/uploaded.json")
            got_digest=$(jq -r '.digest // ""' "$work/uploaded.json")
            if [ "$got_size" != "$size" ] || { [ -n "$got_digest" ] && [ "$got_digest" != "sha256:$want" ]; }; then
              mirror_log "$name: the upload came back as $got_size bytes, digest '$got_digest'"
              exit 1
            fi
            mirror_log "uploaded $name"
          done < "$work/assets.txt"
          gh_api "$api/releases/$id" > "$work/final.json"
          if [ "$(jq -r '.draft' "$work/final.json")" = true ]; then
            gh_api -X PATCH "$api/releases/$id" -H 'Content-Type: application/json' --data '{"draft":false}' > /dev/null
            mirror_log "published $MIRROR_TAG"
          fi
          rm -r "$work"
