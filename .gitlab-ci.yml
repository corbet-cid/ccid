# Remote CI on the GitLab mirror: the ccid remote job "windows" (.ci/ccid.toml, docs/rendering.md).
# A pipeline starts only when the broker (adapters/remote_ci.py) creates it by API for one exact
# commit; pushes from the forge's mirror start nothing. The broker reports the result on the forge.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CCID_REMOTE_JOB && $CCID_EXPECTED_SHA'
    - when: never

windows:
  rules:
    - if: '$CCID_REMOTE_JOB == "windows"'
  tags: [saas-windows-medium-amd64]
  timeout: 90m
  variables:
    CARGO_TERM_COLOR: never
    CARGO_INCREMENTAL: "0"
  script:
    - if ($env:CI_COMMIT_SHA -ne $env:CCID_EXPECTED_SHA) { Write-Error "built $env:CI_COMMIT_SHA, requested $env:CCID_EXPECTED_SHA"; exit 1 }
    - Invoke-WebRequest -UseBasicParsing -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - rustc --version --verbose
    - cargo build --release --locked --features windows-experimental
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - cargo test --release --locked --features windows-experimental
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
