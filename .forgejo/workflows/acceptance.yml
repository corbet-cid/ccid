# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Forgejo Actions adapter: runs of the declared checks.
# A newer run of the same ref cancels the older one.
name: acceptance
on:
  workflow_dispatch:
concurrency:
  group: ccid-acceptance-${{ github.ref }}
  cancel-in-progress: true
# The speed profile every CI compile shares: no incremental state, no debug information.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_TERM_COLOR: never
jobs:
  cache-acceptance:
    runs-on: heavy
    steps:
      - name: Fetch the exact commit
        env:
          CCID_FORGE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init --quiet .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: token $CCID_FORGE_TOKEN" fetch --quiet --depth 1 origin "${{ github.sha }}"
          git checkout --quiet --force --detach FETCH_HEAD
          git clean --quiet -ffdx
      - name: Run the declared checks
        env:
          CCID_REVISION: 44960243c4e694d637574d5947110db267353ddd
          CCID_TOOL_SHA256: 3e0554f67163b06727eba831f6241a0433c46d5fc1f99460eddebc598fa45001
        run: |
          set -eu
          : "${CCID_TOOL_ROOT:?the runner must provide CCID_TOOL_ROOT}"
          triple="${CCID_TOOL_TRIPLE:-$(uname -m)-unknown-linux-gnu}"
          tool="$CCID_TOOL_ROOT/ccid/$CCID_REVISION/$triple/ccid"
          # A runner without the declared tool fetches the pinned release by hash: CCID_TOOL_URL (runner environment) is the package base, the digest comes from the manifest.
          if [ ! -x "$tool" ] && [ -n "${CCID_TOOL_URL:-}" ] && [ -n "${CCID_TOOL_SHA256:-}" ]; then
            mkdir -p "$(dirname "$tool")"
            curl --fail --silent --show-error --location "$CCID_TOOL_URL/$CCID_REVISION/ccid-$triple" --output "$tool.part"
            echo "$CCID_TOOL_SHA256  $tool.part" | sha256sum --check --strict
            chmod 0555 "$tool.part"
            mv "$tool.part" "$tool"
          fi
          test -x "$tool" || { echo "ccid $CCID_REVISION is not provisioned at $tool" >&2; exit 2; }
          test "$("$tool" source-revision)" = "$CCID_REVISION"
          export CCID_SOURCE_REVISION="${{ github.sha }}"
          "$tool" render --repo "$PWD" --check
          exec "$tool" check --repo "$PWD" --check 'cache-acceptance'
  native-compile-cache:
    runs-on: heavy
    steps:
      - name: Fetch the exact commit
        env:
