# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Forgejo Actions adapter: runs of the declared checks.
# A newer run of the same ref cancels the older one.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ccid-ci-${{ github.ref }}
  cancel-in-progress: true
# The speed profile every CI compile shares: no incremental state, no debug information.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_TERM_COLOR: never
jobs:
  build:
    runs-on: heavy
    steps:
      - name: Fetch the exact commit and run the declared checks
        env:
          CCID_FORGE_TOKEN: ${{ github.token }}
          CCID_REVISION: 105ddc4cc22bd460ddb7e9e68207f265ca229a34
          CCID_TOOL_SHA256: d3378c2ee0185079dbd3dd7d2d5de4a904851158f0f4e647154b7f4158f9856d
        run: |
          set -eu
          # A runner may name CCID_SOURCE_ROOT: the source then lives in a stable directory per repository, job and slot instead of the per-task directory, so absolute source
          # paths (cargo's CARGO_MANIFEST_DIR, which sccache puts into every key) repeat from run to run and the compile caches hit. A slot is claimed by a lock directory that
          # holds the pid and start time of this shell (the shell becomes the check by exec, so the pid lives as long as the job; no file descriptor is inherited by daemons).
          if [ -n "${CCID_SOURCE_ROOT:-}" ]; then
            slots="${CCID_SOURCE_SLOTS:-2}"
            base="$CCID_SOURCE_ROOT/${{ github.repository }}/${{ github.job }}"
            mkdir -p "$base"
            me="$$ $(cut -d' ' -f22 /proc/$$/stat)"
            deadline=$(( $(date +%s) + ${CI_TIMEOUT:-2700} ))
            slot=
            while [ -z "$slot" ]; do
              n=1
              while [ "$n" -le "$slots" ]; do
                if mkdir "$base/slot-$n.lock" 2>/dev/null; then slot=$n; break; fi
                held=$(cat "$base/slot-$n.lock/owner" 2>/dev/null || true)
                pid=${held%% *}; start=${held#* }
                if [ -n "$pid" ] && [ "$(cut -d' ' -f22 "/proc/$pid/stat" 2>/dev/null || true)" != "$start" ]; then
                  # The owner is gone (crashed or killed): one job wins the rename and reclaims the slot, the others retry.
                  if mv "$base/slot-$n.lock" "$base/slot-$n.dead.$$" 2>/dev/null; then rm -r "$base/slot-$n.dead.$$"; fi
                  continue
                fi
                n=$((n + 1))
              done
              if [ -z "$slot" ]; then
                [ "$(date +%s)" -lt "$deadline" ] || { echo "no free source slot under $base" >&2; exit 2; }
                sleep 5
              fi
            done
            echo "$me" > "$base/slot-$slot.lock/owner"
            mkdir -p "$base/slot-$slot"
            cd "$base/slot-$slot"
            echo "CCID_SOURCE_DIR=$PWD" >> "${GITHUB_ENV:-/dev/null}"
          fi
          git init --quiet .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          fetch() { git -c "http.extraHeader=Authorization: token $CCID_FORGE_TOKEN" fetch --quiet --depth 1 origin "${{ github.sha }}"; }
          # A runner may route the fetch to a local copy of the repository (its own git configuration); that copy can lag the push by seconds. Then ask the forge itself.
          fetch || { echo "local copy lacks ${{ github.sha }}, fetching from the forge" >&2; GIT_CONFIG_COUNT=0 fetch; }
          # Git LFS: a repository that tracks files with LFS gets the real content, not the pointer files (the fetch above carries the token, so does the LFS transfer).
          GIT_LFS_SKIP_SMUDGE=1 git checkout --quiet --force --detach FETCH_HEAD
          if git show FETCH_HEAD:.gitattributes 2>/dev/null | grep -q 'filter=lfs'; then
            git -c "http.extraHeader=Authorization: token $CCID_FORGE_TOKEN" lfs pull origin
          fi
          git clean --quiet -ffdx
          : "${CCID_TOOL_ROOT:?the runner must provide CCID_TOOL_ROOT}"
          triple="${CCID_TOOL_TRIPLE:-$(uname -m)-unknown-linux-gnu}"
          tool="$CCID_TOOL_ROOT/ccid/$CCID_REVISION/$triple/ccid"
          # A runner without the declared tool fetches the pinned release by hash: CCID_TOOL_URL (runner environment) is the package base, the digest comes from the manifest.
          if [ ! -x "$tool" ] && [ -n "${CCID_TOOL_URL:-}" ] && [ -n "${CCID_TOOL_SHA256:-}" ]; then
            mkdir -p "$(dirname "$tool")"
            # Concurrent jobs fetch the same release: each into a temp file of its own, the rename is atomic and the content is the pinned digest either way.
            part=$(mktemp "$tool.XXXXXX")
            curl --fail --silent --show-error --location "$CCID_TOOL_URL/$CCID_REVISION/ccid-$triple" --output "$part"
            echo "$CCID_TOOL_SHA256  $part" | sha256sum --check --strict
            chmod 0555 "$part"
            mv -f "$part" "$tool"
          fi
          test -x "$tool" || { echo "ccid $CCID_REVISION is not provisioned at $tool" >&2; exit 2; }
          test "$("$tool" source-revision)" = "$CCID_REVISION"
          export CCID_SOURCE_REVISION="${{ github.sha }}"
          "$tool" render --repo "$PWD" --check
          export CI_COMMIT_SHA="${{ github.sha }}" CI_REPOSITORY_URL="${{ github.server_url }}/${{ github.repository }}"
          exec "$tool" check --repo "$PWD" --check 'build'
      - name: Archive the locked flake inputs
        run: |
          set -eu
          cd "${CCID_SOURCE_DIR:-.}"
          if [ -f flake.lock ] && [ -n "${CCID_FLAKE_ARCHIVE_PUSH:-}" ]; then
            nix flake archive --json . | jq -r '[.. | .path? // empty] | unique | .[]' | xargs --no-run-if-empty $CCID_FLAKE_ARCHIVE_PUSH
          else
            echo "no flake.lock or no archive target on this runner: nothing archived"
          fi
